<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="favicon.png">

  <!-- SEO Meta Tags -->
  <title>DIU Transport Schedule - Daffodil International University Bus Timing</title>
  <meta name="description"
    content="Find the latest Daffodil International University (DIU) transport schedule. Check bus timings for Regular, Mid-Term, Final Exam, and Ramadan schedules easily." />
  <meta name="keywords"
    content="DIU Transport, Daffodil International University, DIU Bus Schedule, DIU Transport Schedule, Ashulia Transport, DIU Dhanmondi Transport, University Bus Timing" />
  <meta name="author" content="Slightsmile" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://diushuttle.vercel.app/" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://diushuttle.vercel.app/" />
  <meta property="og:title" content="DIU Transport Schedule - Daffodil International University Bus Timing" />
  <meta property="og:description"
    content="Find the latest Daffodil International University (DIU) transport schedule. Check bus timings for Regular, Mid-Term, Final Exam, and Ramadan schedules easily." />
  <meta property="og:image" content="https://diushuttle.vercel.app/diu.png" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://diushuttle.vercel.app/" />
  <meta property="twitter:title" content="DIU Transport Schedule - Daffodil International University Bus Timing" />
  <meta property="twitter:description"
    content="Find the latest Daffodil International University (DIU) transport schedule. Check bus timings for Regular, Mid-Term, Final Exam, and Ramadan schedules easily." />
  <meta property="twitter:image" content="https://diushuttle.vercel.app/diu.png" />

  <link rel="stylesheet" href="styles.css" />

  <!-- Structured Data (JSON-LD) -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "DIU Transport Schedule",
      "url": "https://diushuttle.vercel.app/",
      "description": "A tool to check the transport schedule of Daffodil International University.",
      "applicationCategory": "UtilityApplication",
      "operatingSystem": "Any",
      "author": {
        "@type": "Person",
        "name": "Slightsmile",
        "url": "https://github.com/Slightsmile"
      },
      "image": "https://diushuttle.vercel.app/diu.png"
    }
  </script>

  <!-- SheetJS (XLSX) CDN to parse Excel in the browser -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" defer></script>
  <script src="scripts.js" defer></script>
</head>

<body>
  <header class="site-header">
    <div class="logo-wrap">
      <!-- Local logo image -->
      <img src="diu.png" alt="Daffodil International University Logo" class="logo-image" />
    </div>
    <h1 class="title">Transport Schedule</h1>
    <div class="schedule-buttons">
      <button class="sched-btn active" data-file="Transport Schedule Regular.xlsx">Regular</button>
      <button class="sched-btn" data-file="Transport Schedule Mid-Term.xlsx">Mid-Term</button>
      <button class="sched-btn" data-file="Transport Schedule Final Exam.xlsx">Final</button>
      <button class="sched-btn" data-file="Transport Schedule Ramadan.xlsx">Ramadan</button>
    </div>
  </header>

  <main class="container">
    <section class="controls">
      <div class="filters">
        <div class="select-wrap">
          <label for="routeSelect">Route</label>
          <select id="routeSelect">
            <option value="">All routes</option>
          </select>
        </div>

        <div class="input-wrap">
          <label for="searchInput">Search</label>
          <input id="searchInput" type="text" placeholder="Route no, name, detail or time…" />
        </div>

        <div class="toggle-wrap">
          <input type="checkbox" id="fridayToggle" />
          <label for="fridayToggle">Friday schedules only</label>
        </div>
      </div>
    </section>

    <section id="results" class="results" aria-live="polite"></section>
  </main>

  <footer class="site-footer">
    <div class="right">
      <a id="githubLink" href="https://github.com/Slightsmile" target="_blank" rel="noopener">Made by: Slightsmile</a>
    </div>
  </footer>
</body>

</html>
